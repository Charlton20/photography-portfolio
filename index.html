<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charlton Mapiye | Photography</title>
  <meta name="description" content="Landscape, portrait, and travel photography by Charlton Mapiye.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a href="#top" class="logo">Charlton Mapiye</a>
    <nav aria-label="Main navigation">
      <ul class="nav-list">
        <li><a href="#work">Work</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="top" class="hero">
      <div class="hero-content">
        <p class="eyebrow">Landscape &middot; Portrait &middot; Travel</p>
        <h1>Charlton Mapiye Photography</h1>
        <p class="tagline">Capturing quiet light, wild places, and honest faces.</p>
        <a href="#work" class="btn">View my work</a>
      </div>
    </section>

    <section id="work" class="gallery-section">
      <h2>Selected Work</h2>
      <div class="gallery">
        <figure class="gallery-item gallery-item--wide">
          <img src="https://picsum.photos/id/1015/1200/700" alt="Deep blue fjord running between rocky cliffs" width="1200" height="700" loading="lazy">
          <figcaption>Fjord Lookout</figcaption>
        </figure>
        <figure class="gallery-item gallery-item--tall">
          <img src="https://picsum.photos/id/64/600/900" alt="Woman in sunglasses holding wildflowers in a golden field" width="600" height="900" loading="lazy">
          <figcaption>Wildflower Portrait</figcaption>
        </figure>
        <figure class="gallery-item">
          <img src="https://picsum.photos/id/29/800/600" alt="Snow-capped mountain range under a blue sky" width="800" height="600" loading="lazy">
          <figcaption>Alpine Ridge</figcaption>
        </figure>
        <figure class="gallery-item">
          <img src="https://picsum.photos/id/76/800/600" alt="Green bicycle leaning against a weathered wooden shed" width="800" height="600" loading="lazy">
          <figcaption>The Old Shed</figcaption>
        </figure>
        <figure class="gallery-item">
          <img src="https://picsum.photos/id/110/800/600" alt="Sunset over a grassy field with a row of trees" width="800" height="600" loading="lazy">
          <figcaption>Golden Hour</figcaption>
        </figure>
        <figure class="gallery-item gallery-item--tall">
          <img src="https://picsum.photos/id/15/600/900" alt="Waterfall pouring into a rocky gorge" width="600" height="900" loading="lazy">
          <figcaption>Hidden Falls</figcaption>
        </figure>
        <figure class="gallery-item">
          <img src="https://picsum.photos/id/129/800/600" alt="Couple sitting on a bench looking out over the bay" width="800" height="600" loading="lazy">
          <figcaption>Bayside Bench</figcaption>
        </figure>
        <figure class="gallery-item">
          <img src="https://picsum.photos/id/42/800/600" alt="Two coffee cups on a wooden cafe table" width="800" height="600" loading="lazy">
          <figcaption>Morning Coffee</figcaption>
        </figure>
        <figure class="gallery-item gallery-item--wide">
          <img src="https://picsum.photos/id/1018/1200/700" alt="Green cliffs and a winding road under a cloudy sky" width="1200" height="700" loading="lazy">
          <figcaption>Highland Road</figcaption>
        </figure>
        <figure class="gallery-item">
          <img src="https://picsum.photos/id/16/800/600" alt="Calm sea with rocks and driftwood on the shore" width="800" height="600" loading="lazy">
          <figcaption>Still Water</figcaption>
        </figure>
        <figure class="gallery-item">
          <img src="https://picsum.photos/id/1025/800/600" alt="Pug wrapped in a plaid blanket on a forest path" width="800" height="600" loading="lazy">
          <figcaption>Forest Pug</figcaption>
        </figure>
        <figure class="gallery-item">
          <img src="https://picsum.photos/id/142/800/600" alt="Grand chateau at the end of a long gravel path" width="800" height="600" loading="lazy">
          <figcaption>The Chateau</figcaption>
        </figure>
      </div>
    </section>

    <section id="about" class="about">
      <h2>About Me</h2>
    </section>

    <section id="contact" class="contact">
      <h2>Book a Shoot</h2>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Charlton Mapiye</p>
  </footer>
</body>
</html>
